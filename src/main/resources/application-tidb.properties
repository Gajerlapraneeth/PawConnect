# Activate with SPRING_PROFILES_ACTIVE=tidb.
# Obtain these values from your own TiDB Cloud Connect dialog. Never commit passwords.
spring.datasource.url=${TIDB_JDBC_URL}
spring.datasource.username=${TIDB_USER}
spring.datasource.password=${TIDB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
